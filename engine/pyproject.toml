[project]
name = "clipapp-engine"
version = "0.0.1"
description = "Local processing engine for ClipApp"
requires-python = "==3.12.*"
dependencies = [
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "pydantic>=2.10",
    "pysubs2>=1.9.1",
    "typer>=0.12",
]

[project.optional-dependencies]
# NVIDIA runtime for ctranslate2 4.9 on GPU: CUDA 12 cuBLAS + cuDNN 9 (cuDNN 8 unsupported since 4.5).
cuda = [
    "nvidia-cublas-cu12>=12.4,<13",
    "nvidia-cudnn-cu12>=9.1,<10",
]

[project.scripts]
clipapp-engine = "clipapp_engine.cli:app"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[tool.uv]
# The [cuda] wheels must exist for Windows x64 (some nvidia-* releases are Linux-only).
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "D"]
ignore = ["D203", "D213", "D413", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests", "../scripts"]

[[tool.mypy.overrides]]
module = ["ctranslate2", "ctranslate2.*", "faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real-model tests (need samples/ and a downloaded model)"]
