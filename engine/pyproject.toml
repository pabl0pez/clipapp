[project]
name = "clipapp-engine"
version = "0.0.1"
description = "Local processing engine for ClipApp"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.10",
    "typer>=0.12",
]

[project.scripts]
clipapp-engine = "clipapp_engine.cli:app"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PL", "D"]
ignore = ["D203", "D213", "D413", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests", "../scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
